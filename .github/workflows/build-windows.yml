name: Build Windows desktop app

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Opcionális: a Supabase-projekt címe (https://<projekt>.supabase.co). Megadva a telepített program bejelentkezéssel, ehhez a projekthez kapcsolódik; a beállítófájl felülírja."
        required: false
        default: ""
      supabase_anon_key:
        description: "Opcionális: a projekt NYILVÁNOS (anon / publishable) kulcsa. Soha ne a service_role / secret kulcs!"
        required: false
        default: ""
  push:
    branches:
      - claude/inventory-management-app-yjc3v5
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          # Csak kézi indításnál, ha megadták: a nyilvános cím és kulcs (a böngészőbe is bekerülnek).
          VITE_SUPABASE_URL: ${{ github.event.inputs.supabase_url }}
          VITE_SUPABASE_ANON_KEY: ${{ github.event.inputs.supabase_anon_key }}

      - name: Copy build output into electron/dist
        run: Copy-Item -Path dist -Destination electron/dist -Recurse
        shell: pwsh

      - name: Install electron dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows installer
        working-directory: electron
        run: npx electron-builder --win --x64 --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: Keszletkezelo-Windows-Setup
          path: electron/dist-electron/*.exe
          retention-days: 30
