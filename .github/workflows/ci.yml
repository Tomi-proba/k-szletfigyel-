name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Az adatbázis-tesztek (tests/db) a valódi supabase/schema.sql-t futtatják egy PostgreSQL-en.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KESZLET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keszlet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run lint
      # Az integrációs szolgáltatás (F15.2) saját csomag.
      - run: npm ci --no-audit --no-fund
        working-directory: integracio
      - run: npm test
        working-directory: integracio
